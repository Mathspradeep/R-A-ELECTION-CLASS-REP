    const compressAndConvertImage = (file, callback) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 250;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          callback(dataUrl);
        };
      };
    };

    function App() {

      const [candidates, setCandidates] = useState(DEFAULT_CANDIDATES);

      useEffect(() => {
        if (db) {
          const electionRef = db.ref("election_data");

            const data = snapshot.val();
            if (data) {
              if (data.votes) setVotes(data.votes);
              if (data.votedStudents) setVotedStudents(data.votedStudents);
              if (data.detailedVotes) setDetailedVotes(data.detailedVotes);
              if (data.candidates && Array.isArray(data.candidates) && data.candidates.length > 0) {
                setCandidates(data.candidates);
              }
              if (data.stage) setElectionStage(data.stage);
            } else {
              db.ref("election_data").set({
                votes: { c1: 0, c2: 0, c3: 0 },
                votedStudents: [],
                detailedVotes: [],
                candidates: DEFAULT_CANDIDATES,
                stage: "voting"
              });
            }
          });
          return () => electionRef.off();
        }
      }, []);

        const v = updatedVotes !== undefined ? updatedVotes : votes;
        const s = updatedStudents !== undefined ? updatedStudents : votedStudents;
        const d = updatedDetailedVotes !== undefined ? updatedDetailedVotes : detailedVotes;
        const c = updatedCandidates !== undefined ? updatedCandidates : candidates;
        const st = updatedStage !== undefined ? updatedStage : electionStage;

        setVotes(v);
        setVotedStudents(s);
        setDetailedVotes(d);
        setCandidates(c);
        setElectionStage(st);

        if (db) {
          db.ref("election_data").set({ votes: v, votedStudents: s, detailedVotes: d, candidates: c, stage: st })
            .catch((err) => {
              setMessage({ type: "error", text: "Firebase Error: " + err.message });
            });
        }
      };

        e.preventDefault();
        const cleanName = inputName.trim().toUpperCase();
        const cleanAdmission = inputAdmissionNo.trim().toUpperCase();

        if (!cleanName || !cleanAdmission) {
          setMessage({ type: "error", text: "Please enter your Name and Admission Number!" });
          return;
        }

        // Search record in register
        const studentMatch = STUDENT_ROSTER.find(s => 
          s.name === cleanName && 
          s.admissionNo === cleanAdmission
        );

        if (!studentMatch) {
          setMessage({ type: "error", text: "Credentials not found! Please check your Name and Admission Number." });
          return;
        }

        if (votedStudents.includes(studentMatch.admissionNo)) {
          setMessage({ type: "error", text: `Student '${studentMatch.name}' (${studentMatch.admissionNo}) has ALREADY voted!` });
          return;
        }

        setLoggedInStudent(studentMatch);
        setMessage({ type: "success", text: `Welcome, ${studentMatch.name}! Select a candidate to cast your vote.` });
      };

      // Vote Submission Handler
      const handleVoteSubmit = (e) => {
        e.preventDefault();

        if (!loggedInStudent) {
          setMessage({ type: "error", text: "Please log in first!" });
          return;
        }

        if (!selectedCandidate) {
          setMessage({ type: "error", text: "Please select a candidate before submitting." });
          return;
        }

        const candidateObj = candidates.find(c => c.id === selectedCandidate);
        const candidateName = candidateObj ? candidateObj.name : "Unknown";

        const updatedVotes = { ...votes, [selectedCandidate]: (votes[selectedCandidate] || 0) + 1 };
        const updatedVotedStudents = [...votedStudents, loggedInStudent.admissionNo];
        
        const newAuditLogEntry = {
          studentName: loggedInStudent.name,
          admissionNo: loggedInStudent.admissionNo,
          rollNo: loggedInStudent.rollNo,
          votedFor: candidateName,
          timestamp: new Date().toLocaleTimeString() + ", " + new Date().toLocaleDateString()
        };

        const updatedDetailedVotes = [...detailedVotes, newAuditLogEntry];

        syncDatabase(updatedVotes, updatedVotedStudents, updatedDetailedVotes);

        setVoteSuccess(true);
        setMessage(null);
        setSelectedCandidate("");
        setLoggedInStudent(null);
        setInputName("");
        setInputAdmissionNo("");

          setMessage({ type: "success", text: "Admin panel unlocked!" });

      const totalVotes = Object.values(votes).reduce((a, b) => a + b, 0);

      const getWinner = () => {
        let max = -1;
        let winner = null;
        candidates.forEach((c) => {
          const count = votes[c.id] || 0;
          if (count > max) {
            max = count;
            winner = c;
          }
        });
        return max > 0 ? { ...winner, voteCount: max } : null;
      };

      const winner = getWinner();

                            src={cand.avatar}

          {activeTab === "candidates" && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {candidates.map((cand) => (
                <div key={cand.id} className="bg-white rounded-2xl shadow-sm border p-6 text-center">
                  <img 
                    src={cand.avatar} 
                    onError={(e) => { e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(cand.name)}&background=2563eb&color=fff`; }} 
                    className="w-24 h-24 rounded-2xl object-cover bg-slate-100 border mx-auto mb-4 shadow-sm" 
                  />
                  <h3 className="font-extrabold text-lg text-slate-900">{cand.name}</h3>
                  <p className="text-xs text-slate-500 mb-4">{cand.badge}</p>
                  <p className="text-sm text-slate-600 border-t pt-3">{cand.manifesto}</p>
                </div>
              ))}
            </div>
          )}

          {/* TAB 3: ADMIN PANEL */}
          {activeTab === "admin" && (
            <div>
              {!isAdminAuthenticated ? (
                <div className="max-w-md mx-auto bg-white rounded-2xl shadow-sm border p-8 text-center space-y-4">
                  <div className="text-3xl">🔒</div>
                  <h2 className="text-xl font-bold">Admin Portal</h2>
                  <p className="text-xs text-slate-500">Enter secret PIN to view live voting status and student choice audit logs.</p>
                  <form onSubmit={handleAdminLogin} className="space-y-4">
                    <input
                      type="password"
                      placeholder="Enter Admin PIN"
                      value={enteredPin}
                      onChange={(e) => setEnteredPin(e.target.value)}
                      className="w-full px-4 py-2.5 border rounded-xl text-center font-mono text-lg"
                    />
                    <button type="submit" className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm">
                      Unlock Admin Panel
                    </button>
                  </form>
                </div>
              ) : (
                <div className="space-y-6">
                  {/* LIVE RESULTS */}
                  <div className="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
                    <div className="flex justify-between items-center">
                      <h2 className="text-xl font-bold">📊 Live Tally ({totalVotes} Total Votes)</h2>
                      {electionStage === "closed" && winner && (
                        <button onClick={triggerConfetti} className="bg-amber-500 text-white text-xs font-bold px-3 py-2 rounded-lg">
                          🎉 Celebrate Winner
                        </button>
                      )}
                    </div>

                    {electionStage === "closed" && winner && (
                      <div className="bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-2xl p-6 text-center">
                        <span className="text-xs font-bold uppercase tracking-widest bg-black/20 px-3 py-1 rounded-full">🏆 Winner Declared</span>
                        <img 
                          src={winner.avatar} 
                          onError={(e) => { e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(winner.name)}&background=2563eb&color=fff`; }} 
                          className="w-20 h-20 rounded-full object-cover border-4 border-white shadow-md mx-auto my-3" 
                        />
                        <h3 className="text-3xl font-extrabold">{winner.name}</h3>
                        <p className="text-amber-100 text-sm mt-1">Elected Class Representative with {winner.voteCount} votes!</p>
                      </div>
                    )}

                    <div className="space-y-4 pt-2">
                      {candidates.map((cand) => {
                        const count = votes[cand.id] || 0;
                        const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                        return (
                          <div key={cand.id} className="space-y-1">
                            <div className="flex justify-between text-sm font-bold">
                              <span className="flex items-center gap-2">
                                <img 
                                  src={cand.avatar} 
                                  onError={(e) => { e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(cand.name)}&background=2563eb&color=fff`; }} 
                                  className="w-6 h-6 rounded-full object-cover" 
                                />
                                {cand.name}
                              </span>
                              <span>{count} votes ({pct}%)</span>
                            </div>
                            <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                              <div className="bg-blue-600 h-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* ADMIN AUDIT TABLE */}
                  <div className="bg-white rounded-2xl shadow-sm border p-6">
                    <h2 className="text-lg font-bold text-slate-900 mb-1">👁️ Detailed Voter Audit Log</h2>
                    <p className="text-xs text-slate-500 mb-4">Admin privilege: List of students and the candidate they voted for.</p>

                    {detailedVotes.length === 0 ? (
                      <div className="p-4 bg-slate-50 text-slate-500 rounded-xl text-center text-xs">No votes recorded yet.</div>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs border-collapse">
                          <thead>
                            <tr className="bg-slate-100 text-slate-700 font-bold uppercase border-b">
                              <th className="p-2.5">#</th>
                              <th className="p-2.5">Student Name</th>
                              <th className="p-2.5">Admission No</th>
                              <th className="p-2.5">Roll No</th>
                              <th className="p-2.5">Voted Candidate</th>
                              <th className="p-2.5">Time</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y font-medium text-slate-800">
                            {detailedVotes.map((log, index) => (
                              <tr key={index} className="hover:bg-slate-50">
                                <td className="p-2.5 text-slate-400">{index + 1}</td>
                                <td className="p-2.5 font-bold">{log.studentName}</td>
                                <td className="p-2.5 font-mono">{log.admissionNo}</td>
                                <td className="p-2.5 font-mono">{log.rollNo}</td>
                                <td className="p-2.5 font-bold text-blue-600">{log.votedFor}</td>
                                <td className="p-2.5 text-slate-500">{log.timestamp}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>

                  {/* Add New Candidate */}
                  <div className="bg-white rounded-2xl shadow-sm border p-6">
                    <h2 className="text-lg font-bold mb-4">➕ Add New Candidate</h2>
                    <form onSubmit={handleAddCandidate} className="space-y-4">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" placeholder="Candidate Name *" value={newCandName} onChange={(e) => setNewCandName(e.target.value)} className="p-2.5 border rounded-xl text-sm font-semibold" />
                        <input type="text" placeholder="Role / Badge (e.g. Sports Lead)" value={newCandBadge} onChange={(e) => setNewCandBadge(e.target.value)} className="p-2.5 border rounded-xl text-sm" />
                      </div>
                      <textarea placeholder="Manifesto / Agenda" value={newCandManifesto} onChange={(e) => setNewCandManifesto(e.target.value)} className="w-full p-2.5 border rounded-xl text-sm"></textarea>
                      
                      <div className="flex items-center gap-3">
                        <label className="cursor-pointer bg-slate-100 text-slate-700 hover:bg-slate-200 px-4 py-2 rounded-xl text-xs font-semibold border inline-block">
                          📁 Select Photo
                          <input type="file" accept="image/*" onChange={(e) => handleImageFileChange(e)} className="hidden" />
                        </label>
                        {newCandPhoto && <span className="text-xs text-green-600 font-bold">✓ Photo Attached & Compressed</span>}
                      </div>

                      <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm shadow">
                        + Save & Add Candidate
                      </button>
                    </form>
                  </div>

                  {/* Photo Upload Manager */}
                  <div className="bg-white rounded-2xl shadow-sm border p-6">
                    <h2 className="text-lg font-bold mb-2">📷 Change Candidate Photos</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                      {candidates.map((cand) => (
                        <div key={cand.id} className="border p-4 rounded-xl text-center bg-slate-50">
                          <img 
                            src={cand.avatar} 
                            onError={(e) => { e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(cand.name)}&background=2563eb&color=fff`; }} 
                            className="w-16 h-16 rounded-full object-cover mx-auto mb-2 border bg-white" 
                          />
                          <div className="font-bold text-sm text-slate-900">{cand.name}</div>
                          <label className="mt-3 block cursor-pointer bg-blue-600 text-white py-1.5 px-3 rounded-lg text-xs font-semibold hover:bg-blue-700 transition">
                            Upload New Photo
                            <input type="file" accept="image/*" onChange={(e) => handleImageFileChange(e, cand.id)} className="hidden" />
                          </label>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Control Election */}
                  <div className="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
                    <h2 className="text-lg font-bold">⚙️ Election Control</h2>
                    <div className="flex gap-4">
                      <button onClick={() => syncDatabase(undefined, undefined, undefined, undefined, "voting")} className={`flex-1 py-2.5 rounded-xl text-xs font-bold ${electionStage === 'voting' ? 'bg-green-600 text-white' : 'bg-slate-100'}`}>Open Voting</button>
                      <button onClick={() => { syncDatabase(undefined, undefined, undefined, undefined, "closed"); triggerConfetti(); }} className={`flex-1 py-2.5 rounded-xl text-xs font-bold ${electionStage === 'closed' ? 'bg-amber-600 text-white' : 'bg-slate-100'}`}>Close Voting & Announce Winner</button>
                    </div>
                    <button onClick={resetElection} className="bg-red-50 text-red-600 border border-red-200 px-4 py-2.5 rounded-xl text-xs font-bold w-full hover:bg-red-100 transition">
                      Reset Election Data
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
