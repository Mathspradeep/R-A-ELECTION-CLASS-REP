<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Representative Election Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // YOUR SECRET ADMIN PIN (Default: 1234)
    const SECRET_ADMIN_PIN = "1234";

    // YOUR FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyAnCWfmpa9y-VZ7xZHIAWtJo7wr9THKOxs",
      authDomain: "class-rep-election.firebaseapp.com",
      databaseURL: "https://class-rep-election-default-rtdb.firebaseio.com",
      projectId: "class-rep-election",
      storageBucket: "class-rep-election.firebasestorage.app",
      messagingSenderId: "686522659502",
      appId: "1:686522659502:web:36d0a1e3d7bdd9d2d6f33f",
      measurementId: "G-Q3CWWC9XE1"
    };

    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch(e) {
      console.warn("Fallback to LocalStorage", e);
    }

    const DEFAULT_CANDIDATES = [
      {
        id: "c1",
        name: "CHRISTOPHER",
        badge: "Academic & Tech Lead",
        manifesto: "Organizing study notes, coordinating lab time slots, and ensuring transparent communication with faculty.",
        avatar: "https://ui-avatars.com/api/?name=CHRISTOPHER&background=2563eb&color=fff&size=200"
      },
      {
        id: "c2",
        name: "RITHIK K",
        badge: "Sports & Cultural Lead",
        manifesto: "Leading class event coordination, organizing sports activities, and driving student engagement.",
        avatar: "https://ui-avatars.com/api/?name=RITHIK+K&background=059669&color=fff&size=200"
      },
      {
        id: "c3",
        name: "MAHALAKSHMI",
        badge: "Student Affairs Lead",
        manifesto: "Establishing peer mentoring groups, timetable optimization, and active student welfare support.",
        avatar: "https://ui-avatars.com/api/?name=MAHALAKSHMI&background=d97706&color=fff&size=200"
      }
    ];

    const VALID_STUDENTS = Array.from({ length: 30 }, (_, i) => `STU1${String(i + 1).padStart(2, '0')}`);

    // Helper: Compress heavy image files before sending to Firebase
    const compressAndConvertImage = (file, callback) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 300; // Resize photo max dimension to 300px
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          callback(dataUrl);
        };
      };
    };

    function App() {
      const [activeTab, setActiveTab] = useState("vote");
      const [candidates, setCandidates] = useState(DEFAULT_CANDIDATES);
      const [votes, setVotes] = useState({ c1: 0, c2: 0, c3: 0 });
      const [votedStudents, setVotedStudents] = useState([]);
      const [electionStage, setElectionStage] = useState("voting");

      const [studentId, setStudentId] = useState("");
      const [selectedCandidate, setSelectedCandidate] = useState("");
      const [message, setMessage] = useState(null);
      const [voteSuccess, setVoteSuccess] = useState(false);

      // Admin Auth State
      const [enteredPin, setEnteredPin] = useState("");
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);

      // Photo upload for candidate form
      const [newCandName, setNewCandName] = useState("");
      const [newCandBadge, setNewCandBadge] = useState("");
      const [newCandManifesto, setNewCandManifesto] = useState("");
      const [newCandPhoto, setNewCandPhoto] = useState(null);

      // Sync with Firebase Realtime Database
      useEffect(() => {
        if (db) {
          const electionRef = db.ref("election_data");
          electionRef.on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
              if (data.votes) setVotes(data.votes);
              if (data.votedStudents) setVotedStudents(data.votedStudents);
              if (data.candidates) setCandidates(data.candidates);
              if (data.stage) setElectionStage(data.stage);
            }
          });
          return () => electionRef.off();
        }
      }, []);

      const syncDatabase = (updatedVotes, updatedStudents, updatedCandidates, updatedStage) => {
        const v = updatedVotes !== undefined ? updatedVotes : votes;
        const s = updatedStudents !== undefined ? updatedStudents : votedStudents;
        const c = updatedCandidates !== undefined ? updatedCandidates : candidates;
        const st = updatedStage !== undefined ? updatedStage : electionStage;

        setVotes(v);
        setVotedStudents(s);
        setCandidates(c);
        setElectionStage(st);

        if (db) {
          db.ref("election_data").set({ votes: v, votedStudents: s, candidates: c, stage: st });
        }
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (enteredPin === SECRET_ADMIN_PIN) {
          setIsAdminAuthenticated(true);
          setMessage({ type: "success", text: "Admin unlocked!" });
        } else {
          setMessage({ type: "error", text: "Incorrect Admin PIN!" });
        }
      };

      const handleImageFileChange = (e, targetCandidateId = null) => {
        const file = e.target.files[0];
        if (!file) return;

        compressAndConvertImage(file, (compressedBase64) => {
          if (targetCandidateId) {
            const updated = candidates.map((c) => (c.id === targetCandidateId ? { ...c, avatar: compressedBase64 } : c));
            syncDatabase(undefined, undefined, updated);
            setMessage({ type: "success", text: "Photo uploaded & compressed live!" });
          } else {
            setNewCandPhoto(compressedBase64);
            setMessage({ type: "success", text: "Photo ready for new candidate!" });
          }
        });
      };

      const handleAddCandidate = (e) => {
        e.preventDefault();
        if (!newCandName.trim()) {
          setMessage({ type: "error", text: "Please enter candidate name." });
          return;
        }

        const newId = "c_" + Date.now();
        const fallbackAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(newCandName)}&background=0D8ABC&color=fff&size=200`;
        const newCandidate = {
          id: newId,
          name: newCandName.toUpperCase().trim(),
          badge: newCandBadge.trim() || "Candidate",
          manifesto: newCandManifesto.trim() || "Working for class welfare.",
          avatar: newCandPhoto || fallbackAvatar
        };

        const updatedCand = [...candidates, newCandidate];
        const updatedVotes = { ...votes, [newId]: 0 };

        syncDatabase(updatedVotes, undefined, updatedCand);

        setNewCandName("");
        setNewCandBadge("");
        setNewCandManifesto("");
        setNewCandPhoto(null);
        setMessage({ type: "success", text: `Candidate '${newCandidate.name}' added!` });
      };

      const handleVoteSubmit = (e) => {
        e.preventDefault();
        const formattedId = studentId.trim().toUpperCase();

        if (!formattedId) {
          setMessage({ type: "error", text: "Please enter your Roll Number / ID." });
          return;
        }

        if (!VALID_STUDENTS.includes(formattedId)) {
          setMessage({ type: "error", text: "Invalid Roll Number. Allowed IDs: STU101 to STU130." });
          return;
        }

        if (votedStudents.includes(formattedId)) {
          setMessage({ type: "error", text: `Student ID '${formattedId}' has already voted!` });
          return;
        }

        if (!selectedCandidate) {
          setMessage({ type: "error", text: "Please select a candidate to vote." });
          return;
        }

        const updatedVotes = { ...votes, [selectedCandidate]: (votes[selectedCandidate] || 0) + 1 };
        const updatedVotedStudents = [...votedStudents, formattedId];

        syncDatabase(updatedVotes, updatedVotedStudents);

        setVoteSuccess(true);
        setMessage(null);
        setStudentId("");
        setSelectedCandidate("");
      };

      const triggerConfetti = () => {
        if (window.confetti) window.confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
      };

      const resetElection = () => {
        if (confirm("Are you sure you want to reset all votes and restore default candidates?")) {
          syncDatabase({ c1: 0, c2: 0, c3: 0 }, [], DEFAULT_CANDIDATES, "voting");
          setMessage({ type: "info", text: "Election data reset to defaults." });
        }
      };

      const totalVotes = Object.values(votes).reduce((a, b) => a + b, 0);

      const getWinner = () => {
        let max = -1;
        let winner = null;
        candidates.forEach((c) => {
          const count = votes[c.id] || 0;
          if (count > max) {
            max = count;
            winner = c;
          }
        });
        return max > 0 ? { ...winner, voteCount: max } : null;
      };

      const winner = getWinner();

      return (
        <div className="max-w-3xl mx-auto px-4 py-8">
          <header className="bg-slate-900 text-white rounded-2xl p-6 mb-6 shadow-xl flex justify-between items-center">
            <div>
              <div className="inline-block px-3 py-1 bg-blue-500/20 text-blue-400 rounded-full text-xs font-semibold uppercase tracking-wider mb-2">
                Official Department Portal
              </div>
              <h1 className="text-2xl font-extrabold">Class Representative Election</h1>
            </div>
            <div className="bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl text-center">
              <span className="text-xs text-slate-400 block uppercase">Status</span>
              <span className={`text-sm font-bold ${electionStage === 'voting' ? 'text-green-400' : 'text-amber-400'}`}>
                {electionStage === 'voting' ? '🟢 Voting Open' : '🔴 Voting Closed'}
              </span>
            </div>
          </header>

          {/* Navigation Tabs - ONLY Vote, Candidates, and Admin */}
          <div className="flex bg-white p-1.5 rounded-xl shadow-sm border mb-6 gap-1">
            <button onClick={() => { setActiveTab("vote"); setVoteSuccess(false); }} className={`flex-1 py-2.5 rounded-lg font-medium text-sm ${activeTab === 'vote' ? 'bg-blue-600 text-white' : 'text-slate-600'}`}>🗳️ Cast Vote</button>
            <button onClick={() => setActiveTab("candidates")} className={`flex-1 py-2.5 rounded-lg font-medium text-sm ${activeTab === 'candidates' ? 'bg-blue-600 text-white' : 'text-slate-600'}`}>👥 Candidates</button>
            <button onClick={() => setActiveTab("admin")} className={`flex-1 py-2.5 rounded-lg font-medium text-sm ${activeTab === 'admin' ? 'bg-slate-900 text-white' : 'text-slate-600'}`}>🔒 Admin</button>
          </div>

          {message && (
            <div className={`p-4 rounded-xl mb-6 text-sm font-medium flex justify-between items-center ${message.type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`}>
              <span>{message.text}</span>
              <button onClick={() => setMessage(null)} className="font-bold ml-4">✕</button>
            </div>
          )}

          {/* TAB 1: VOTE ONLY */}
          {activeTab === "vote" && (
            <div className="bg-white rounded-2xl shadow-sm border p-6">
              {voteSuccess ? (
                <div className="py-8 text-center space-y-4">
                  <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
                  <h2 className="text-2xl font-extrabold text-slate-900">Your Vote Has Been Cast Successfully!</h2>
                  <p className="text-sm text-slate-500 max-w-md mx-auto">
                    Thank you for participating. Your response has been securely recorded in the official database.
                  </p>
                  <button onClick={() => setVoteSuccess(false)} className="mt-4 bg-slate-900 text-white font-bold py-2.5 px-6 rounded-xl text-sm">
                    Back to Voting Form
                  </button>
                </div>
              ) : electionStage === "closed" ? (
                <div className="bg-amber-50 border border-amber-200 text-amber-800 p-8 rounded-xl text-center">
                  <h3 className="text-lg font-bold">Voting Has Concluded</h3>
                  <p className="text-sm mt-1">The election process is completed. Thank you!</p>
                </div>
              ) : (
                <form onSubmit={handleVoteSubmit} className="space-y-6">
                  <h2 className="text-xl font-bold text-slate-900">Cast Your Secret Vote</h2>
                  
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-2">Student Roll Number / ID</label>
                    <input
                      type="text"
                      value={studentId}
                      onChange={(e) => setStudentId(e.target.value)}
                      placeholder="e.g. STU101"
                      className="w-full px-4 py-3 border rounded-xl font-mono uppercase text-lg"
                    />
                    <p className="text-xs text-slate-500 mt-1">Allowed range: STU101 to STU130</p>
                  </div>

                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-3">Select Candidate</label>
                    <div className="space-y-3">
                      {candidates.map((cand) => (
                        <label key={cand.id} className={`flex items-center p-4 rounded-xl border-2 cursor-pointer transition ${selectedCandidate === cand.id ? 'border-blue-600 bg-blue-50/50' : 'border-slate-200'}`}>
                          <input type="radio" name="candidate" value={cand.id} checked={selectedCandidate === cand.id} onChange={() => setSelectedCandidate(cand.id)} />
                          <img 
                            src={cand.avatar} 
                            onError={(e) => { e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(cand.name)}&background=2563eb&color=fff`; }} 
                            className="w-12 h-12 rounded-full object-cover ml-3 mr-3 border bg-slate-100" 
                          />
                          <div>
                            <div className="font-bold text-slate-900">{cand.name}</div>
                            <div className="text-xs text-slate-500">{cand.badge}</div>
                          </div>
                        </label>
                      ))}
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3.5 px-6 rounded-xl shadow text-base">
                    Submit Vote Anonymously
                  </button>
                </form>
              )}
            </div>
          )}

          {/* TAB 2: CANDIDATES */}
          {activeTab === "candidates" && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {candidates.map((cand) => (
                <div key={cand.id} className="bg-white rounded-2xl shadow-sm border p-6 text-center">
                  <img 
                    src={cand.avatar} 
                    onError={(e) => { e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(cand.name)}&background=2563eb&color=fff`; }} 
                    className="w-24 h-24 rounded-2xl object-cover bg-slate-100 border mx-auto mb-4 shadow-sm" 
                  />
                  <h3 className="font-extrabold text-lg text-slate-900">{cand.name}</h3>
                  <p className="text-xs text-slate-500 mb-4">{cand.badge}</p>
                  <p className="text-sm text-slate-600 border-t pt-3">{cand.manifesto}</p>
                </div>
              ))}
            </div>
          )}

          {/* TAB 3: ADMIN (SECRET RESULTS & CONTROLS) */}
          {activeTab === "admin" && (
            <div>
              {!isAdminAuthenticated ? (
                <div className="max-w-md mx-auto bg-white rounded-2xl shadow-sm border p-8 text-center space-y-4">
                  <div className="text-3xl">🔒</div>
                  <h2 className="text-xl font-bold">Admin Portal</h2>
                  <p className="text-xs text-slate-500">Enter secret PIN to view live results, upload candidate photos, and manage election controls.</p>
                  <form onSubmit={handleAdminLogin} className="space-y-4">
                    <input
                      type="password"
                      placeholder="Enter Admin PIN"
                      value={enteredPin}
                      onChange={(e) => setEnteredPin(e.target.value)}
                      className="w-full px-4 py-2.5 border rounded-xl text-center font-mono text-lg"
                    />
                    <button type="submit" className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm">
                      Unlock Admin Panel
                    </button>
                  </form>
                </div>
              ) : (
                <div className="space-y-6">
                  {/* LIVE RESULTS (ADMIN ONLY) */}
                  <div className="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
                    <div className="flex justify-between items-center">
                      <h2 className="text-xl font-bold">📊 Live Results ({totalVotes} Total Votes)</h2>
                      {electionStage === "closed" && winner && (
                        <button onClick={triggerConfetti} className="bg-amber-500 text-white text-xs font-bold px-3 py-2 rounded-lg">
                          🎉 Celebrate Winner
                        </button>
                      )}
                    </div>

                    {electionStage === "closed" && winner && (
                      <div className="bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-2xl p-6 text-center">
                        <span className="text-xs font-bold uppercase tracking-widest bg-black/20 px-3 py-1 rounded-full">🏆 Winner Declared</span>
                        <img 
                          src={winner.avatar} 
                          onError={(e) => { e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(winner.name)}&background=2563eb&color=fff`; }} 
                          className="w-20 h-20 rounded-full object-cover border-4 border-white shadow-md mx-auto my-3" 
                        />
                        <h3 className="text-3xl font-extrabold">{winner.name}</h3>
                        <p className="text-amber-100 text-sm mt-1">Elected Class Representative with {winner.voteCount} votes!</p>
                      </div>
                    )}

                    <div className="space-y-4 pt-2">
                      {candidates.map((cand) => {
                        const count = votes[cand.id] || 0;
                        const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                        return (
                          <div key={cand.id} className="space-y-1">
                            <div className="flex justify-between text-sm font-bold">
                              <span className="flex items-center gap-2">
                                <img 
                                  src={cand.avatar} 
                                  onError={(e) => { e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(cand.name)}&background=2563eb&color=fff`; }} 
                                  className="w-6 h-6 rounded-full object-cover" 
                                />
                                {cand.name}
                              </span>
                              <span>{count} votes ({pct}%)</span>
                            </div>
                            <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                              <div className="bg-blue-600 h-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Voted Students List */}
                    <div className="pt-4 border-t">
                      <h3 className="text-xs font-bold uppercase text-slate-500 mb-2">Voted Students ({votedStudents.length} / 30)</h3>
                      <div className="flex flex-wrap gap-1.5">
                        {votedStudents.map((id) => (
                          <span key={id} className="bg-slate-100 border text-slate-700 px-2 py-1 rounded font-mono text-xs font-bold">{id}</span>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Photo Upload Manager */}
                  <div className="bg-white rounded-2xl shadow-sm border p-6">
                    <h2 className="text-lg font-bold mb-4">📷 Upload / Change Candidate Photos</h2>
                    <p className="text-xs text-slate-500 mb-4">Click "Change Photo" below to pick any image from your camera/gallery. It will auto-compress and update instantly on all student devices.</p>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {candidates.map((cand) => (
                        <div key={cand.id} className="border p-4 rounded-xl text-center">
                          <img 
                            src={cand.avatar} 
                            onError={(e) => { e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(cand.name)}&background=2563eb&color=fff`; }} 
                            className="w-16 h-16 rounded-full object-cover mx-auto mb-2 border bg-slate-100" 
                          />
                          <div className="font-bold text-sm">{cand.name}</div>
                          <label className="mt-3 block cursor-pointer bg-blue-50 text-blue-600 border border-blue-200 py-1.5 px-3 rounded-lg text-xs font-semibold hover:bg-blue-100 transition">
                            Change Photo
                            <input type="file" accept="image/*" onChange={(e) => handleImageFileChange(e, cand.id)} className="hidden" />
                          </label>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Add New Candidate */}
                  <div className="bg-white rounded-2xl shadow-sm border p-6">
                    <h2 className="text-lg font-bold mb-4">➕ Add New Candidate</h2>
                    <form onSubmit={handleAddCandidate} className="space-y-4">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" placeholder="Candidate Name" value={newCandName} onChange={(e) => setNewCandName(e.target.value)} className="p-2.5 border rounded-xl text-sm" />
                        <input type="text" placeholder="Role/Badge" value={newCandBadge} onChange={(e) => setNewCandBadge(e.target.value)} className="p-2.5 border rounded-xl text-sm" />
                      </div>
                      <textarea placeholder="Manifesto / Description" value={newCandManifesto} onChange={(e) => setNewCandManifesto(e.target.value)} className="w-full p-2.5 border rounded-xl text-sm"></textarea>
                      <div className="flex items-center gap-3">
                        <label className="cursor-pointer bg-slate-100 text-slate-700 hover:bg-slate-200 px-4 py-2 rounded-xl text-xs font-semibold border inline-block">
                          📁 Upload Photo
                          <input type="file" accept="image/*" onChange={(e) => handleImageFileChange(e)} className="hidden" />
                        </label>
                        {newCandPhoto && <span className="text-xs text-green-600 font-bold">✓ Photo Processed & Ready</span>}
                      </div>
                      <button type="submit" className="block bg-emerald-600 text-white font-bold py-2.5 px-5 rounded-xl text-xs shadow">Add Candidate</button>
                    </form>
                  </div>

                  {/* Control Election */}
                  <div className="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
                    <h2 className="text-lg font-bold">⚙️ Election Control</h2>
                    <div className="flex gap-4">
                      <button onClick={() => syncDatabase(undefined, undefined, undefined, "voting")} className={`flex-1 py-2.5 rounded-xl text-xs font-bold ${electionStage === 'voting' ? 'bg-green-600 text-white' : 'bg-slate-100'}`}>Open Voting</button>
                      <button onClick={() => { syncDatabase(undefined, undefined, undefined, "closed"); triggerConfetti(); }} className={`flex-1 py-2.5 rounded-xl text-xs font-bold ${electionStage === 'closed' ? 'bg-amber-600 text-white' : 'bg-slate-100'}`}>Close Voting & Announce Winner</button>
                    </div>
                    <button onClick={resetElection} className="bg-red-50 text-red-600 border border-red-200 px-4 py-2.5 rounded-xl text-xs font-bold w-full hover:bg-red-100 transition">
                      Reset Election & Clean Photos
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
