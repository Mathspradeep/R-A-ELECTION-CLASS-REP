<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Representative Election Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // YOUR EXACT FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyAnCWfmpa9y-VZ7xZHIAWtJo7wr9THKOxs",
      authDomain: "class-rep-election.firebaseapp.com",
      databaseURL: "https://class-rep-election-default-rtdb.firebaseio.com",
      projectId: "class-rep-election",
      storageBucket: "class-rep-election.firebasestorage.app",
      messagingSenderId: "686522659502",
      appId: "1:686522659502:web:36d0a1e3d7bdd9d2d6f33f",
      measurementId: "G-Q3CWWC9XE1"
    };

    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch(e) {
      console.warn("Database initialization fallback to LocalStorage", e);
    }

    const DEFAULT_CANDIDATES = [
      {
        id: "c1",
        name: "CHRISTOPHER",
        badge: "Academic & Tech Lead",
        manifesto: "Organizing study notes, coordinating lab time slots, and ensuring transparent communication with faculty.",
        avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Christopher",
        color: "bg-blue-600"
      },
      {
        id: "c2",
        name: "RITHIK K",
        badge: "Sports & Cultural Lead",
        manifesto: "Leading class event coordination, organizing sports activities, and driving student engagement.",
        avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Rithik",
        color: "bg-purple-600"
      },
      {
        id: "c3",
        name: "MAHALAKSHMI",
        badge: "Student Affairs Lead",
        manifesto: "Establishing peer mentoring groups, timetable optimization, and active student welfare support.",
        avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Mahalakshmi",
        color: "bg-emerald-600"
      }
    ];

    const VALID_STUDENTS = Array.from({ length: 30 }, (_, i) => `STU1${String(i + 1).padStart(2, '0')}`);

    function App() {
      const [activeTab, setActiveTab] = useState("vote");
      const [candidates, setCandidates] = useState(DEFAULT_CANDIDATES);
      const [votes, setVotes] = useState({ c1: 0, c2: 0, c3: 0 });
      const [votedStudents, setVotedStudents] = useState([]);
      const [electionStage, setElectionStage] = useState("voting");

      const [studentId, setStudentId] = useState("");
      const [selectedCandidate, setSelectedCandidate] = useState("");
      const [message, setMessage] = useState(null);
      const [receipt, setReceipt] = useState(null);

      // Photo upload for candidate form
      const [newCandName, setNewCandName] = useState("");
      const [newCandBadge, setNewCandBadge] = useState("");
      const [newCandManifesto, setNewCandManifesto] = useState("");
      const [newCandPhoto, setNewCandPhoto] = useState(null);

      // Sync with Firebase Realtime Database
      useEffect(() => {
        if (db) {
          const electionRef = db.ref("election_data");
          electionRef.on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
              if (data.votes) setVotes(data.votes);
              if (data.votedStudents) setVotedStudents(data.votedStudents);
              if (data.candidates) setCandidates(data.candidates);
              if (data.stage) setElectionStage(data.stage);
            }
          });
          return () => electionRef.off();
        }
      }, []);

      const syncDatabase = (updatedVotes, updatedStudents, updatedCandidates, updatedStage) => {
        const v = updatedVotes !== undefined ? updatedVotes : votes;
        const s = updatedStudents !== undefined ? updatedStudents : votedStudents;
        const c = updatedCandidates !== undefined ? updatedCandidates : candidates;
        const st = updatedStage !== undefined ? updatedStage : electionStage;

        setVotes(v);
        setVotedStudents(s);
        setCandidates(c);
        setElectionStage(st);

        if (db) {
          db.ref("election_data").set({
            votes: v,
            votedStudents: s,
            candidates: c,
            stage: st
          });
        }
      };

      const handleImageFileChange = (e, targetCandidateId = null) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
          setMessage({ type: "error", text: "Image is too large! Please upload a photo under 2 MB." });
          return;
        }

        const reader = new FileReader();
        reader.onloadend = () => {
          const base64Data = reader.result;
          if (targetCandidateId) {
            const updated = candidates.map((c) => (c.id === targetCandidateId ? { ...c, avatar: base64Data } : c));
            syncDatabase(undefined, undefined, updated);
            setMessage({ type: "success", text: "Photo updated live across all phones!" });
          } else {
            setNewCandPhoto(base64Data);
          }
        };
        reader.readAsDataURL(file);
      };

      const handleAddCandidate = (e) => {
        e.preventDefault();
        if (!newCandName.trim()) {
          setMessage({ type: "error", text: "Please enter candidate name." });
          return;
        }

        const newId = "c_" + Date.now();
        const newCandidate = {
          id: newId,
          name: newCandName.toUpperCase().trim(),
          badge: newCandBadge.trim() || "Candidate",
          manifesto: newCandManifesto.trim() || "Working for class welfare.",
          avatar: newCandPhoto || `https://api.dicebear.com/7.x/bottts/svg?seed=${newCandName}`,
          color: "bg-blue-600"
        };

        const updatedCand = [...candidates, newCandidate];
        const updatedVotes = { ...votes, [newId]: 0 };

        syncDatabase(updatedVotes, undefined, updatedCand);

        setNewCandName("");
        setNewCandBadge("");
        setNewCandManifesto("");
        setNewCandPhoto(null);
        setMessage({ type: "success", text: `Candidate '${newCandidate.name}' added!` });
      };

      const handleVoteSubmit = (e) => {
        e.preventDefault();
        const formattedId = studentId.trim().toUpperCase();

        if (!formattedId) {
          setMessage({ type: "error", text: "Please enter your Student Roll Number / ID." });
          return;
        }

        if (!VALID_STUDENTS.includes(formattedId)) {
          setMessage({ type: "error", text: "Invalid Roll Number. Allowed IDs: STU101 to STU130." });
          return;
        }

        if (votedStudents.includes(formattedId)) {
          setMessage({ type: "error", text: `Student ID '${formattedId}' has already voted!` });
          return;
        }

        if (!selectedCandidate) {
          setMessage({ type: "error", text: "Please select a candidate to vote." });
          return;
        }

        const updatedVotes = { ...votes, [selectedCandidate]: (votes[selectedCandidate] || 0) + 1 };
        const updatedVotedStudents = [...votedStudents, formattedId];

        syncDatabase(updatedVotes, updatedVotedStudents);

        const receiptCode = "REC-" + Math.random().toString(36).substring(2, 9).toUpperCase();
        setReceipt({
          id: formattedId,
          code: receiptCode,
          timestamp: new Date().toLocaleTimeString()
        });

        setMessage({ type: "success", text: "Vote cast successfully and synced across all devices!" });
        setStudentId("");
        setSelectedCandidate("");
      };

      const triggerConfetti = () => {
        if (window.confetti) window.confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
      };

      const resetElection = () => {
        if (confirm("Reset all votes and candidates for the whole class?")) {
          syncDatabase({ c1: 0, c2: 0, c3: 0 }, [], DEFAULT_CANDIDATES, "voting");
          setMessage({ type: "info", text: "Election data reset." });
        }
      };

      const totalVotes = Object.values(votes).reduce((a, b) => a + b, 0);

      const getWinner = () => {
        let max = -1;
        let winner = null;
        candidates.forEach((c) => {
          const count = votes[c.id] || 0;
          if (count > max) {
            max = count;
            winner = c;
          }
        });
        return max > 0 ? { ...winner, voteCount: max } : null;
      };

      const winner = getWinner();

      return (
        <div className="max-w-4xl mx-auto px-4 py-8">
          {/* Header */}
          <header className="bg-slate-900 text-white rounded-2xl p-6 mb-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <div className="inline-block px-3 py-1 bg-blue-500/20 text-blue-400 rounded-full text-xs font-semibold uppercase tracking-wider mb-2">
                Official Department Portal
              </div>
              <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight">Class Representative Election</h1>
            </div>
            <div className="bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl text-center">
              <span className="text-xs text-slate-400 block uppercase">Status</span>
              <span className={`text-sm font-bold ${electionStage === 'voting' ? 'text-green-400' : 'text-amber-400'}`}>
                {electionStage === 'voting' ? '🟢 Live Multi-Phone Voting' : '🔴 Voting Closed'}
              </span>
            </div>
          </header>

          {/* Navigation Tabs */}
          <div className="flex bg-white p-1.5 rounded-xl shadow-sm border border-slate-200 mb-6 gap-1">
            <button
              onClick={() => setActiveTab("vote")}
              className={`flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition ${activeTab === 'vote' ? 'bg-blue-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              🗳️ Cast Vote
            </button>
            <button
              onClick={() => setActiveTab("candidates")}
              className={`flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition ${activeTab === 'candidates' ? 'bg-blue-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              👥 Candidates
            </button>
            <button
              onClick={() => setActiveTab("results")}
              className={`flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition ${activeTab === 'results' ? 'bg-blue-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              📊 Live Tally
            </button>
            <button
              onClick={() => setActiveTab("admin")}
              className={`flex-1 py-2.5 px-4 rounded-lg font-medium text-sm transition ${activeTab === 'admin' ? 'bg-blue-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              ⚙️ Admin & Photos
            </button>
          </div>

          {/* Alert Message */}
          {message && (
            <div className={`p-4 rounded-xl mb-6 text-sm font-medium flex justify-between items-center ${
              message.type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' :
              message.type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' :
              'bg-blue-50 text-blue-700 border border-blue-200'
            }`}>
              <span>{message.text}</span>
              <button onClick={() => setMessage(null)} className="text-slate-400 hover:text-slate-600 font-bold ml-4">✕</button>
            </div>
          )}

          {/* TAB 1: VOTE */}
          {activeTab === "vote" && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="md:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 className="text-xl font-bold text-slate-900 mb-4">Cast Your Secret Vote</h2>

                {electionStage === "closed" ? (
                  <div className="bg-amber-50 border border-amber-200 text-amber-800 p-6 rounded-xl text-center">
                    <h3 className="text-lg font-bold">Voting Has Concluded</h3>
                    <p className="text-sm mt-1">Check the Live Tally tab for the final results!</p>
                  </div>
                ) : (
                  <form onSubmit={handleVoteSubmit} className="space-y-6">
                    <div>
                      <label className="block text-sm font-semibold text-slate-700 mb-2">Student ID / Roll Number</label>
                      <input
                        type="text"
                        value={studentId}
                        onChange={(e) => setStudentId(e.target.value)}
                        placeholder="e.g. STU101"
                        className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 uppercase font-mono text-lg"
                      />
                      <p className="text-xs text-slate-500 mt-1">Allowed range: STU101 to STU130</p>
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-slate-700 mb-3">Select Candidate</label>
                      <div className="space-y-3">
                        {candidates.map((cand) => (
                          <label
                            key={cand.id}
                            className={`flex items-center p-4 rounded-xl border-2 cursor-pointer transition ${
                              selectedCandidate === cand.id ? 'border-blue-600 bg-blue-50/50' : 'border-slate-200 hover:border-slate-300'
                            }`}
                          >
                            <input
                              type="radio"
                              name="candidate"
                              value={cand.id}
                              checked={selectedCandidate === cand.id}
                              onChange={() => setSelectedCandidate(cand.id)}
                              className="w-5 h-5 text-blue-600"
                            />
                            <img src={cand.avatar} className="w-12 h-12 rounded-full object-cover ml-3 mr-3 border border-slate-200" />
                            <div>
                              <div className="font-bold text-slate-900">{cand.name}</div>
                              <div className="text-xs text-slate-500">{cand.badge}</div>
                            </div>
                          </label>
                        ))}
                      </div>
                    </div>

                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow">
                      Submit Vote Anonymously
                    </button>
                  </form>
                )}
              </div>

              {/* Receipt / Turnout */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                <div>
                  <h3 className="font-bold text-slate-900 mb-2">Voting Verification</h3>
                  {receipt ? (
                    <div className="bg-slate-900 text-white p-4 rounded-xl font-mono text-xs space-y-2">
                      <div className="text-green-400 font-bold">✓ BALLOT CONFIRMED</div>
                      <hr className="border-slate-700" />
                      <div>Student: {receipt.id}</div>
                      <div>Receipt Code: <span className="text-amber-300 font-bold">{receipt.code}</span></div>
                      <div>Time: {receipt.timestamp}</div>
                    </div>
                  ) : (
                    <div className="border border-dashed border-slate-300 rounded-xl p-6 text-center text-slate-400 text-xs">
                      No vote submitted on this device yet.
                    </div>
                  )}
                </div>

                <div className="mt-6 pt-4 border-t border-slate-100">
                  <div className="flex justify-between text-xs text-slate-500 mb-1">
                    <span>Live Class Turnout:</span>
                    <span className="font-bold text-slate-700">{totalVotes} / {VALID_STUDENTS.length}</span>
                  </div>
                  <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div className="bg-blue-600 h-full transition-all duration-300" style={{ width: `${(totalVotes / VALID_STUDENTS.length) * 100}%` }}></div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: CANDIDATES */}
          {activeTab === "candidates" && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {candidates.map((cand) => (
                <div key={cand.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                  <div>
                    <img src={cand.avatar} className="w-20 h-20 rounded-2xl object-cover bg-slate-100 border mx-auto mb-4" />
                    <h3 className="font-extrabold text-lg text-slate-900 text-center">{cand.name}</h3>
                    <p className="text-xs text-center text-slate-500 mb-4">{cand.badge}</p>
                    <p className="text-sm text-slate-600 border-t border-slate-100 pt-3">{cand.manifesto}</p>
                  </div>
                  <div className="mt-6 space-y-2">
                    <label className="block text-center cursor-pointer bg-slate-50 hover:bg-slate-100 border text-slate-700 font-semibold py-2 px-3 rounded-lg text-xs">
                      📷 Upload Photo
                      <input type="file" accept="image/*" onChange={(e) => handleImageFileChange(e, cand.id)} className="hidden" />
                    </label>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* TAB 3: LIVE RESULTS */}
          {activeTab === "results" && (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
              <div className="flex justify-between items-center">
                <h2 className="text-xl font-bold">Live Election Results ({totalVotes} Votes Cast)</h2>
                {electionStage === "closed" && winner && (
                  <button onClick={triggerConfetti} className="bg-amber-500 text-white text-xs font-bold px-3 py-2 rounded-lg">
                    🎉 Celebrate Winner
                  </button>
                )}
              </div>

              {electionStage === "closed" && winner && (
                <div className="bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-2xl p-6 text-center">
                  <span className="text-xs font-bold uppercase tracking-widest bg-black/20 px-3 py-1 rounded-full">🏆 Winner Declared</span>
                  <img src={winner.avatar} className="w-20 h-20 rounded-full object-cover border-4 border-white shadow-md mx-auto my-3" />
                  <h3 className="text-3xl font-extrabold">{winner.name}</h3>
                  <p className="text-amber-100 text-sm mt-1">Elected as Class Representative with {winner.voteCount} votes!</p>
                </div>
              )}

              <div className="space-y-4">
                {candidates.map((cand) => {
                  const count = votes[cand.id] || 0;
                  const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                  return (
                    <div key={cand.id} className="space-y-1">
                      <div className="flex justify-between text-sm font-bold">
                        <span className="flex items-center gap-2">
                          <img src={cand.avatar} className="w-6 h-6 rounded-full object-cover" />
                          {cand.name}
                        </span>
                        <span>{count} votes ({pct}%)</span>
                      </div>
                      <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                        <div className="bg-blue-600 h-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* TAB 4: ADMIN */}
          {activeTab === "admin" && (
            <div className="space-y-6">
              {/* Add Candidate */}
              <div className="bg-white rounded-2xl shadow-sm border p-6">
                <h2 className="text-lg font-bold mb-4">Add Candidate with Photo</h2>
                <form onSubmit={handleAddCandidate} className="space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" placeholder="Candidate Name" value={newCandName} onChange={(e) => setNewCandName(e.target.value)} className="p-2 border rounded-lg text-sm" />
                    <input type="text" placeholder="Badge/Role" value={newCandBadge} onChange={(e) => setNewCandBadge(e.target.value)} className="p-2 border rounded-lg text-sm" />
                  </div>
                  <textarea placeholder="Manifesto" value={newCandManifesto} onChange={(e) => setNewCandManifesto(e.target.value)} className="w-full p-2 border rounded-lg text-sm"></textarea>
                  <label className="cursor-pointer bg-slate-100 text-slate-700 px-4 py-2 rounded-lg text-xs font-semibold inline-block">
                    📁 Attach Photo File
                    <input type="file" accept="image/*" onChange={(e) => handleImageFileChange(e)} className="hidden" />
                  </label>
                  {newCandPhoto && <span className="text-xs text-green-600 ml-2 font-bold">✓ Photo Ready</span>}
                  <button type="submit" className="block bg-emerald-600 text-white font-bold py-2 px-4 rounded-lg text-xs">Add Candidate</button>
                </form>
              </div>

              {/* Stage Toggle */}
              <div className="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
                <h2 className="text-lg font-bold">Election Control</h2>
                <div className="flex gap-4">
                  <button onClick={() => syncDatabase(undefined, undefined, undefined, "voting")} className={`flex-1 py-2 rounded-lg text-xs font-bold ${electionStage === 'voting' ? 'bg-green-600 text-white' : 'bg-slate-100'}`}>Open Voting</button>
                  <button onClick={() => { syncDatabase(undefined, undefined, undefined, "closed"); triggerConfetti(); }} className={`flex-1 py-2 rounded-lg text-xs font-bold ${electionStage === 'closed' ? 'bg-amber-600 text-white' : 'bg-slate-100'}`}>Close Voting & Announce</button>
                </div>
                <button onClick={resetElection} className="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-lg text-xs font-bold w-full">Reset Election Data</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
